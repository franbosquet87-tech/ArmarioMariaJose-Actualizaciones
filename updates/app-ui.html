.fit-model{height:100%;width:100%;position:absolute;inset:0;object-fit:contain;object-position:center center;z-index:1;pointer-events:none}
.fit-model.personal{object-fit:contain;background:#fbf5f8}
.fit-item{position:absolute;z-index:3;cursor:grab;touch-action:none;user-select:none;display:flex;align-items:center;justify-content:center;filter:drop-shadow(0 4px 6px #442c3d22)}

.fit-item.selected:after{content:'↘';position:absolute;right:-9px;bottom:-9px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:#b05c85;color:white;font-weight:700;font-size:14px}
.fit-tag{position:absolute;top:10px;left:10px;z-index:7;color:#a66085;font-size:9px;background:#fff9fbe8;border:1px solid #edd8e3;border-radius:90px;padding:6px 9px;font-weight:800;pointer-events:none}
.fit-actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:13px 0}

.fit-list{display:flex;gap:9px;overflow-x:auto;padding:5px 1px 10px;scroll-snap-type:x proximity;scrollbar-width:thin}

.fit-details{background:#fff;border:1px solid #eddae4;padding:13px;border-radius:16px;margin:11px 0}

function dateDelta(days=0){const d=new Date();d.setHours(12,0,0,0);d.setDate(d.getDate()+days);return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}

{id:'l1',name:'Brunch de domingo',occasion:'Fin de semana',itemIds:['p1','p7','p6']},

];
const LOOK_OCCASIONS_DEFAULT=['Casual','Trabajo','Fin de semana','Fiesta','Cena','Viaje','Deporte','Boda','Celebración','Ocasión especial'];
function safeLookOccasions(raw){
 const chosen=Array.isArray(raw)?raw:LOOK_OCCASIONS_DEFAULT,seen=new Set(),out=[];
 for(const value of chosen){if(typeof value!=='string')continue;const v=value.trim().replace(/\s+/g,' ').slice(0,60),key=v.toLocaleLowerCase('es');if(!v||seen.has(key))continue;seen.add(key);out.push(v);if(out.length>=60)break;}
 return out;
}

 const values=[...lookOccasions(),...db.looks.map(x=>x.occasion||''),extra],seen=new Set();
 return values.filter(v=>{if(typeof v!=='string'||!v.trim())return false;const k=v.trim().toLocaleLowerCase('es');if(seen.has(k))return false;seen.add(k);return true;});
}

function seed(){return {format:'mi-armario-sweet',version:1,profile:{name:'María José'},items:[],wardrobes:[...WARDROBE_SEED],categories:clone(CATS_SEED),looks:[],lookOccasions:[...LOOK_OCCASIONS_DEFAULT],loans:[]}}

function quitarMuestras(o){
  const ids=new Set();
  for(const item of o.items){
    const e=ITEMS_SEED.find(x=>x.id===item.id);
    if(e&&['id','name','category','wardrobe','spot','size','color','season','notes','favorite','donate']
        .every(k=>item[k]===e[k])&&!item.photo&&JSON.stringify(item.occasions||[])===JSON.stringify(e.occasions||[]))ids.add(item.id);
  }
  const items=o.items.filter(x=>!ids.has(x.id));
  const looks=o.looks.filter(x=>{
    const e=LOOKS_SEED.find(y=>y.id===x.id);
    return !(e&&x.name===e.name&&x.occasion===e.occasion&&JSON.stringify(x.itemIds||[])===JSON.stringify(e.itemIds));
  });
  const loans=o.loans.filter(x=>!(ids.has(x.itemId)&&
    ['ejemplo-prestamo-1','ejemplo-prestamo-2','ejemplo-prestamo-3'].includes(x.id)
    &&String(x.person||'').includes('(ejemplo)')));
  if(items.length===o.items.length&&looks.length===o.looks.length&&loans.length===o.loans.length)return o;
  const next={...o,items,looks,loans};
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(next));return next}catch(_){return o}
}
function load(){try{const s=localStorage.getItem(STORAGE_KEY);if(!s)return seed();const o=JSON.parse(s);if(!o||!Array.isArray(o.items)||!Array.isArray(o.wardrobes)||!Array.isArray(o.categories)||!Array.isArray(o.looks))throw Error();if(!Array.isArray(o.loans))o.loans=[];o.lookOccasions=safeLookOccasions(o.lookOccasions);if(!o.profile||typeof o.profile.name!=='string')o.profile={name:'María José'};return quitarMuestras(o)}catch(e){return seed()}}

function ico(name,cl=''){return `<svg class="ico ${cl}" aria-hidden="true"><use href="#i-${name}"></use></svg>`}
function el(id){return document.getElementById(id)}
function id(){return 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function persist(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(db));return true}catch(e){toast('No queda espacio para guardar. Prueba con una foto más pequeña.');return false}}
function toast(msg){const t=el('toast');t.innerHTML=`<div class="toast">${esc(msg)}</div>`;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.innerHTML='',2700)}
function category(c){return db.categories.find(v=>v.id===c)||null}
function ancestry(cid){const result=[],seen=new Set();let c=category(cid);while(c&&!seen.has(c.id)){result.unshift(c);seen.add(c.id);c=category(c.parentId)}return result}
function catLabel(cid){return category(cid)?.name||'Sin categoría'}
function catPath(cid){return ancestry(cid).map(c=>c.name).join(' · ')}
function descendants(cid){const d=new Set([cid]);let changed=true;while(changed){changed=false;for(const c of db.categories){if(!d.has(c.id)&&d.has(c.parentId)){d.add(c.id);changed=true}}}return d}
function catMatches(i,cid){return !cid||descendants(cid).has(i.category)}
function catCount(cid){return db.items.filter(i=>catMatches(i,cid)&&!i.donate).length}
function qty(){return db.items.filter(i=>!i.donate).length}
function donQty(){return db.items.filter(i=>i.donate).length}
function wardrobeCount(name){return db.items.filter(i=>i.wardrobe===name&&!i.donate).length}

function photoOk(str){return typeof str==='string'&&/^data:image\/(jpeg|png|webp);base64,/i.test(str)&&str.length<1500000}
function cover(i){
 if(photoOk(i.photo))return `<img class="cover-photo" src="${i.photo}" alt="${esc(i.name)}">`;
 const p=ITEMS_SEED.some(g=>g.id===i.id&&g.name===i.name)?DEMO_PHOTOS[i.id]:null;
 if(p){const url=`https://images.pexels.com/photos/${p}/pexels-photo-${p}.jpeg?auto=compress&cs=tinysrgb&w=520`;
   return `<div class="demo-photo-frame">${art(i)}<img class="cover-photo" alt="Foto real: ${esc(i.name)}" loading="lazy" src="${url.replaceAll('&','&amp;')}" onerror="this.remove()"></div>`;
 }
 return art(i);
}
function rowArt(i){return `<div class="row-art">${cover(i)}</div>`}
function card(i){return `<article class="garment"><div class="garment-cover" onclick="detailItem('${i.id}')" role="button" tabindex="0" onkeydown="if(event.key==='Enter')detailItem('${i.id}')">${cover(i)}<button class="heart-btn ${i.favorite?'liked':''}" title="Favoritos" aria-label="Cambiar favorito" onclick="event.stopPropagation();toggleFavorite('${i.id}')">${ico(i.favorite?'heart-solid':'heart')}</button>${i.donate?`<span class="donation-badge">Para donar</span>`:''}${activeLoan(i.id)?`<span class="loan-badge">↗ Prestada</span>`:''}</div><div class="garment-info" role="button" tabindex="0" onclick="detailItem('${i.id}')" onkeydown="if(event.key==='Enter')detailItem('${i.id}')"><div class="garment-cat">${esc(catLabel(i.category))}</div><div class="garment-name" title="${esc(i.name)}">${esc(i.name)}</div><div class="garment-place">${ico('wardrobe','small-ico')} ${esc(i.wardrobe)}</div></div></article>`}
function row(i){return `<div class="row-card">${rowArt(i)}<div class="row-text"><b>${esc(i.name)}</b><small>${esc(catLabel(i.category))} · ${esc(i.wardrobe)}</small>${i.spot?`<small>${esc(i.spot)}</small>`:''}</div><button class="circle-next" aria-label="Ver ${esc(i.name)}" onclick="detailItem('${i.id}')">${ico('chevron')}</button></div>`}
function empty(title,desc,action='',fn=''){return `<div class="empty"><div class="empty-illust">${ico('hanger')}</div><h3>${esc(title)}</h3><p>${esc(desc)}</p>${action?`<button class="outlined" onclick="${fn}">${esc(action)}</button>`:''}</div>`}
function activeItems(){return db.items.filter(i=>!i.donate)}
function openHomeSearch(){navigate('items');ui.quickSearch=true;render();setTimeout(()=>{const input=document.getElementById('search-input');if(input){input.focus();if(input.select)input.select();}},80)}

function enc(x){return encodeURIComponent(x).replace(/'/g,'%27')}
function selectWardrobe(encoded){ui.wardrobe=decodeURIComponent(encoded);ui.cat=null;ui.filter='all';ui.search='';ui.advanced=mjEmptyFilters();ui.advancedOpen=false;navigate('items')}

// Filtros v2: campos nuevos compatibles con prendas y copias JSON antiguas.
const MJ_SEASONS=['Primavera','Verano','Otoño','Invierno'];
const MJ_EVENTS=['Diario','Trabajo','Fiesta','Boda','Cena','Deporte','Celebración','Viaje','Fin de semana','Ocasión especial'];
const MJ_COLORS=['Blanco','Negro','Gris','Beige','Marrón','Rosa','Rojo','Naranja','Amarillo','Verde','Azul','Morado','Dorado','Plateado','Multicolor'];
const MJ_SIZES=['XS','S','M','L','XL','XXL','34','36','38','40','42','44','46'];
const MJ_DEFAULT_CHOICES={colors:MJ_COLORS,seasons:MJ_SEASONS,events:MJ_EVENTS,sizes:MJ_SIZES};
const MJ_COLORMAP={
 'Blanco':['blanco','blanca','marfil','hueso','off white'],
 'Negro':['negro','negra'],
 'Gris':['gris','plomo','antracita'],
 'Beige':['beige','crema','nude','arena','camel','tostado','champan','champagne'],
 'Marrón':['marron','chocolate','cafe','cacao','tabaco'],
 'Rosa':['rosa','rosado','fucsia','magenta','empolvado'],
 'Rojo':['rojo','roja','granate','burdeos','vino','carmesi'],
 'Naranja':['naranja','coral','melocoton'],
 'Amarillo':['amarillo','amarilla','mostaza'],
 'Verde':['verde','oliva','esmeralda','menta'],
 'Azul':['azul','denim','celeste','marino','turquesa'],
 'Morado':['morado','morada','lila','lavanda','violeta','purpura'],
 'Dorado':['dorado','dorada','oro'],
 'Plateado':['plateado','plateada','plata'],
 'Multicolor':['multicolor','estampado','floral','flores','print']
};
function mjNorm(v){return String(v??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('es').trim()}
function mjSafeChoices(raw){const out={};for(const [key,defaults] of Object.entries(MJ_DEFAULT_CHOICES)){const a=raw?.[key];out[key]=Array.isArray(a)?[...new Set(a.filter(x=>typeof x==='string').map(x=>x.trim().slice(0,40)).filter(Boolean))].slice(0,60):[...defaults]}return out}
function mjCatalog(key){if(!MJ_DEFAULT_CHOICES[key])return [];return Array.isArray(db.filterSettings?.[key])?db.filterSettings[key]:MJ_DEFAULT_CHOICES[key]}
function mjSeasonList(item){
 const raw=Array.isArray(item?.seasons)?item.seasons.filter(x=>typeof x==='string'&&x.length<=40):[];
 if(raw.length)return [...new Set(raw)];
 const legacy=mjNorm(item?.season||'Todo el año');
 if(legacy.includes('todo el ano'))return [...MJ_SEASONS];
 if(legacy.includes('entretiempo'))return ['Primavera','Otoño'];
 const matches=MJ_SEASONS.filter(x=>legacy.includes(mjNorm(x)));
 return matches.length?matches:[...MJ_SEASONS];
}
function mjSeasonLabel(item){const seasons=mjSeasonList(item);return seasons.length===4&&MJ_SEASONS.every(x=>seasons.includes(x))?'Todo el año':seasons.join(' · ')}
function mjEvents(item){return Array.isArray(item?.occasions)?[...new Set(item.occasions.filter(x=>typeof x==='string'&&x.length<=40))]:[]}
function mjColorGroup(color){
 const norm=mjNorm(color);if(!norm)return '';
 // Un color personalizado exacto (p. ej., "Turquesa") tiene prioridad sobre Azul.
 const exact=mjCatalog('colors').find(c=>mjNorm(c)===norm);if(exact)return exact;
 for(const [group,aliases] of Object.entries(MJ_COLORMAP)){
   if(aliases.some(a=>new RegExp('(^|[^a-z])'+a+'([^a-z]|$)').test(norm)))return group;
 }
 return String(color).trim();
}
function mjAutoCatalogValue(key,value){const v=String(value||'').trim();if(!v||!MJ_DEFAULT_CHOICES[key])return;if(key==='colors'&&mjCatalog('colors').includes(mjColorGroup(v)))return;
 if(!mjCatalog(key).some(x=>mjNorm(x)===mjNorm(v))&&mjCatalog(key).length<60){db.filterSettings=mjSafeChoices(db.filterSettings);db.filterSettings[key].push(v.slice(0,40))}}
function mjEmptyFilters(){return {type:'',color:'',season:'',event:'',size:'',favorite:false,availability:''}}
function mjFilters(){if(!ui.advanced)ui.advanced=mjEmptyFilters();return ui.advanced}
function mjAnyFilters(){return Object.values(mjFilters()).some(Boolean)}
function mjClearFilters(){ui.advanced=mjEmptyFilters();ui.filter='all';ui.search='';ui.cat=null;ui.advancedOpen=false;render()}
function mjSetFilter(name,value){if(!Object.prototype.hasOwnProperty.call(mjEmptyFilters(),name))return;mjFilters()[name]=value;render()}
function mjToggleMore(){ui.advancedOpen=!ui.advancedOpen;render()}
function mjToggleFilterPanel(){ui.filterOpen=!ui.filterOpen;render()}
function mjRemoveFilter(key){if(!Object.prototype.hasOwnProperty.call(mjEmptyFilters(),key))return;mjFilters()[key]=key==='favorite'?false:'';render()}
function mjFilterSelect(name,label,value,options){
 const f=mjFilters(),current=String(f[name]||'');
 return `<label class="mj-filter-field ${current?'active':''}"><span><b>${esc(label)}</b><em>${esc(current||'Todos')}</em></span><span class="mj-arrow">⌄</span><select aria-label="Filtrar por ${esc(label)}" onchange="mjSetFilter('${name}',this.value)"><option value="">Todos</option>${options.map(v=>{const val=typeof v==='string'?v:v.value,txt=typeof v==='string'?v:v.label;return `<option value="${esc(val)}" ${val===current?'selected':''}>${esc(txt)}</option>`}).join('')}</select></label>`
}
function mjColorOptions(){return mjCatalog('colors')}
function mjTypeOptions(){return flatCats().map(({c,depth})=>({value:c.id,label:`${'— '.repeat(depth)}${c.name}`}))}
function mjSizeOptions(){return mjCatalog('sizes')}
function mjFilterChip(key,label){return `<button type="button" class="mj-active-chip" onclick="mjRemoveFilter('${key}')" aria-label="Quitar ${esc(label)}">${esc(label)} <span class="mj-x">×</span></button>`}
function mjQuickPill(name,label,value,options){
 const current=String(value||'');
 const shortened={type:'Tipo',color:'Color',season:'Temporada',event:'Evento'}[name]||label;
 return `<label class="mj-quick-pick ${current?'active':''}" title="Elegir ${esc(label)}">

let mjRailState=null, mjRailTimer=null, mjRailAuto=null, mjRailSuppressClickUntil=0;
let mjRailAbort=new AbortController();
function mjRailOpen(ev,id){
 if(Date.now()<mjRailSuppressClickUntil){ev.preventDefault();ev.stopPropagation();return}
 setCategory(id);
}
function mjRailKey(ev,id){
 if(ev.altKey&&(ev.key==='ArrowUp'||ev.key==='ArrowDown')){
  ev.preventDefault();const wrap=document.getElementById('mj-category-list');if(!wrap)return;
  const cards=[...wrap.querySelectorAll('.mj-cat-row')];const i=cards.findIndex(c=>c.dataset.cat===id),j=i+(ev.key==='ArrowUp'?-1:1);
  if(i<0||j<0||j>=cards.length)return;
  if(j>i)cards[j].after(cards[i]);else cards[j].before(cards[i]);
  const moved=mjRailSaveOrder(wrap);cards[i].focus();if(moved)toast('Orden guardado ♡');
  return;
 }
 if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();mjRailOpen(ev,id)}
}
function mjRailSaveOrder(wrap){
 const parent=wrap.dataset.parent||null;
 const order=[...wrap.querySelectorAll('.mj-cat-row')].map(c=>c.dataset.cat);
 const slots=db.categories.map((c,i)=>c.parentId===parent?i:-1).filter(i=>i!==-1);
 if(slots.length!==order.length)return false;
 const old=slots.map(i=>db.categories[i].id);
 if(old.every((c,i)=>c===order[i]))return false;
 const lookup=new Map(db.categories.map(c=>[c.id,c]));
 if(order.some(id=>!lookup.has(id)||lookup.get(id).parentId!==parent))return false;
 slots.forEach((slot,i)=>db.categories[slot]=lookup.get(order[i]));
 persist();return true;
}
function mjRailClearTimers(){clearTimeout(mjRailTimer);clearInterval(mjRailAuto);mjRailTimer=null;mjRailAuto=null}
function mjRailBegin(wrap,row,x,y,mode){
 mjRailFinish();
 mjRailState={wrap,row,mode,startX:x,startY:y,x,y,active:false,ghost:null,offset:0};
 mjRailTimer=setTimeout(()=>{
  const s=mjRailState;
  if(!s||s.row!==row||!row.isConnected)return;
  s.active=true;mjRailSuppressClickUntil=Date.now()+1500;
  const rect=row.getBoundingClientRect();s.offset=y-rect.top;
  s.ghost=row.cloneNode(true);s.ghost.removeAttribute('id');s.ghost.removeAttribute('tabindex');s.ghost.removeAttribute('onclick');s.ghost.removeAttribute('onkeydown');s.ghost.setAttribute('aria-hidden','true');s.ghost.classList.add('mj-cat-ghost');
  s.ghost.style.width=rect.width+'px';s.ghost.style.height=rect.height+'px';s.ghost.style.left=rect.left+'px';
  s.ghost.style.top=(s.y-s.offset)+'px';document.body.appendChild(s.ghost);
  row.classList.add('is-dragging');
  mjRailAuto=setInterval(()=>{
   const a=mjRailState;if(!a||!a.active)return;
   // Scroll page only if the dragged category nears a screen edge.
   if(a.y<108)window.scrollBy(0,-14);
   else if(a.y>window.innerHeight-115)window.scrollBy(0,14);
   mjRailPosition(a);
  },55);
  try{navigator.vibrate?.(12)}catch(e){}
 },440);
}
function mjRailPosition(s){
 if(!s||!s.active||!s.row.isConnected)return;
 const row=s.row,wrap=s.wrap;
 if(s.ghost)s.ghost.style.top=(s.y-s.offset)+'px';
 const others=[...wrap.querySelectorAll('.mj-cat-row')].filter(c=>c!==row);
 const target=others.find(c=>s.y<c.getBoundingClientRect().top+c.getBoundingClientRect().height/2);
 if(target){if(row.nextElementSibling!==target)wrap.insertBefore(row,target)}
 else if(wrap.lastElementChild!==row)wrap.appendChild(row);
}
function mjRailFinish(){
 const s=mjRailState;mjRailState=null;mjRailClearTimers();if(!s)return;
 s.ghost?.remove();s.row.classList.remove('is-dragging');
 if(s.active){
  mjRailSuppressClickUntil=Date.now()+650;
  if(s.wrap.isConnected&&mjRailSaveOrder(s.wrap))toast('Categorías ordenadas ♡');
 }
}
function mjRailTouchStart(ev){
 if(ev.touches.length!==1)return;
 const row=ev.target.closest('.mj-cat-row');if(!row)return;
 const t=ev.touches[0];mjRailBegin(ev.currentTarget,row,t.clientX,t.clientY,'touch');
}
function mjRailTouchMove(ev){
 const s=mjRailState;if(!s||s.mode!=='touch')return;
 const t=ev.touches[0];if(!t){mjRailFinish();return}
 s.x=t.clientX;s.y=t.clientY;
 if(!s.active){if(Math.hypot(s.x-s.startX,s.y-s.startY)>10)mjRailFinish();return}
 if(ev.cancelable)ev.preventDefault();mjRailPosition(s);
}
function mjRailPointerDown(ev){
 if(ev.button!==0||ev.pointerType==='touch'||ev.pointerType==='pen')return;
 const row=ev.target.closest('.mj-cat-row');if(!row)return;
 mjRailBegin(ev.currentTarget,row,ev.clientX,ev.clientY,'mouse');
}
function mjRailPointerMove(ev){
 const s=mjRailState;if(!s||s.mode!=='mouse')return;
 s.x=ev.clientX;s.y=ev.clientY;
 if(!s.active){if(Math.hypot(s.x-s.startX,s.y-s.startY)>9)mjRailFinish();return}
 ev.preventDefault();mjRailPosition(s);
}
function mjRailMount(){
 mjRailFinish();mjRailAbort.abort();mjRailAbort=new AbortController();
 const wrap=document.getElementById('mj-category-list');if(!wrap)return;
 const sig=mjRailAbort.signal;
 wrap.addEventListener('touchstart',mjRailTouchStart,{passive:true,signal:sig});
 wrap.addEventListener('touchmove',mjRailTouchMove,{passive:false,signal:sig});
 wrap.addEventListener('touchend',mjRailFinish,{passive:true,signal:sig});
 wrap.addEventListener('touchcancel',mjRailFinish,{passive:true,signal:sig});
 wrap.addEventListener('pointerdown',mjRailPointerDown,{signal:sig});
 document.addEventListener('pointermove',mjRailPointerMove,{signal:sig});
 document.addEventListener('pointerup',()=>{if(mjRailState?.mode==='mouse')mjRailFinish()},{signal:sig});
 document.addEventListener('pointercancel',()=>{if(mjRailState?.mode==='mouse')mjRailFinish()},{signal:sig});
}

function setPhoto(ev){const file=ev.target.files?.[0];if(!file)return;if(!file.type.startsWith('image/')){toast('Selecciona una imagen válida.');return}if(file.size>18e6){toast('Imagen demasiado grande. Usa una foto de menos de 18 MB.');return}const reader=new FileReader();reader.onerror=()=>toast('No se pudo leer la foto.');reader.onload=()=>{const img=new Image();img.onerror=()=>toast('No se pudo abrir la imagen.');img.onload=()=>{const lim=620,scale=Math.min(lim/img.width,lim/img.height,1);const cn=document.createElement('canvas');cn.width=Math.max(1,Math.round(img.width*scale));cn.height=Math.max(1,Math.round(img.height*scale));cn.getContext('2d').drawImage(img,0,0,cn.width,cn.height);draftPhoto=cn.toDataURL('image/jpeg',.7);if(el('photo-preview'))el('photo-preview').innerHTML=formPhoto()};img.src=reader.result};reader.readAsDataURL(file)}

function photoFromFile(file,limit=850){return new Promise((resolve,reject)=>{if(!file||!file.type.startsWith('image/')||file.size>18e6){reject(Error('Selecciona una imagen de menos de 18 MB.'));return}const r=new FileReader();r.onerror=()=>reject(Error('No se pudo leer la imagen.'));r.onload=()=>{const im=new Image();im.onerror=()=>reject(Error('No se pudo abrir la imagen.'));im.onload=()=>{const scale=Math.min(limit/im.width,limit/im.height,1),c=document.createElement('canvas');c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/jpeg',.77))};im.src=r.result};r.readAsDataURL(file)})}

async function fitRemoveBackground(){const l=fitting().layers.find(x=>x.uid===fitState.selected),i=l&&db.items.find(x=>x.id===l.gid);if(!l||!i||!photoOk(i.photo))return;try{const img=await loadFitImage(i.photo),cv=document.createElement('canvas');cv.width=img.naturalWidth;cv.height=img.naturalHeight;const cx=cv.getContext('2d',{willReadFrequently:true});cx.drawImage(img,0,0);const dat=cx.getImageData(0,0,cv.width,cv.height),d=dat.data,w=cv.width,h=cv.height,seen=new Uint8Array(w*h),stack=[];
// Only remove light background connected to the edges. White details enclosed in the garment stay intact.
const ok=(k)=>{const z=k*4,r=d[z],g=d[z+1],b=d[z+2],min=Math.min(r,g,b),max=Math.max(r,g,b);return min>208 && max-min<38};
for(let x=0;x<w;x++){if(ok(x))stack.push(x);if(ok((h-1)*w+x))stack.push((h-1)*w+x)}for(let y=0;y<h;y++){if(ok(y*w))stack.push(y*w);if(ok(y*w+w-1))stack.push(y*w+w-1)}
while(stack.length){const k=stack.pop();if(seen[k])continue;seen[k]=1;if(!ok(k))continue;d[k*4+3]=0;const y=Math.floor(k/w),x=k%w;if(x>0&&!seen[k-1])stack.push(k-1);if(x<w-1&&!seen[k+1])stack.push(k+1);if(y>0&&!seen[k-w])stack.push(k-w);if(y<h-1&&!seen[k+w])stack.push(k+w)}cx.putImageData(dat,0,0);const out=cv.toDataURL('image/png');if(!photoOk(out)){toast('La imagen resultante es demasiado grande.');return}l.transparentSrc=out;persist();render();toast('Fondo claro eliminado (experimental)')}
catch(err){toast('No se pudo quitar el fondo de esta fotografía.') }}
function fitSaveLook(){const f=fitting();if(!f.layers.length){toast('Primero coloca alguna prenda.');return}const n=window.prompt('¿Cómo quieres llamar a este look?',`Look de mi probador ${db.looks.length+1}`);if(n===null)return;const name=n.trim().slice(0,80);if(!name){toast('Escribe un nombre para el look.');return}db.looks.unshift({id:id(),name,occasion:'Probador',itemIds:[...new Set(f.layers.map(l=>l.gid))],fittingLayers:clone(f.layers),fittingModelPhoto:photoOk(f.modelPhoto)?f.modelPhoto:''});persist();toast('¡Look guardado! Puedes verlo en Mis looks ♡')}
function openFittingLook(lid){const l=db.looks.find(x=>x.id===lid);if(!l||!Array.isArray(l.fittingLayers))return;db.fitting=validateFitting({layers:clone(l.fittingLayers),modelPhoto:l.fittingModelPhoto||''});fitState.selected=null;persist();navigate('fitting')}
function loadFitImage(src){return new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>resolve(i);i.onerror=reject;i.src=src})}
async function fitExportPng(){try{const f=fitting(),c=document.createElement('canvas');c.width=720;c.height=975;const ctx=c.getContext('2d');ctx.fillStyle='#faf0f4';ctx.fillRect(0,0,720,975);const model=await loadFitImage(photoOk(f.modelPhoto)?f.modelPhoto:svgUrl(DEMO_MODEL_SVG));if(photoOk(f.modelPhoto)){const ratio=Math.min(c.width/model.width,c.height/model.height);ctx.drawImage(model,(c.width-model.width*ratio)/2,(c.height-model.height*ratio)/2,model.width*ratio,model.height*ratio)}else ctx.drawImage(model,0,0,720,975);
for(const l of f.layers){const i=db.items.find(x=>x.id===l.gid);if(!i)continue;const pic=await loadFitImage(fitImage(i,l)),x=l.x*720,y=l.y*975,w=l.w*720,h=l.h*975;ctx.save();ctx.translate(x+w/2,y+h/2);ctx.rotate((l.angle||0)*Math.PI/180);const r=Math.min(w/pic.width,h/pic.height),iw=pic.width*r,ih=pic.height*r;ctx.drawImage(pic,-iw/2,-ih/2,iw,ih);ctx.restore()}
const a=document.createElement('a');a.download='mi_armario_probador.png';a.href=c.toDataURL('image/png');document.body.appendChild(a);a.click();a.remove();toast('Imagen del probador preparada ♡')}catch(err){toast('No se pudo exportar la imagen.')}}

 window.deleteWardrobe=function(index){const name=db.wardrobes[index];if(!name)return;if(db.items.some(i=>i.wardrobe===name)){toast('Primero mueve las prendas de este armario.');return}confirmModal('Eliminar armario',`¿Eliminar «${name}»? Este armario está vacío.`,'Eliminar',()=>{db.wardrobes.splice(index,1);if(db.wardrobePhotos)delete db.wardrobePhotos[name];if(ui.wardrobe===name)ui.wardrobe=null;persist();render();toast('Armario eliminado')})}
 window.categoryForm=function(cid=null){

select></div><div class="sheet-actions"><button class="outlined" type="button" onclick="closeModal()">Cancelar</button><button class="primary" type="submit">${ico('check')} Guardar</button></div></form>${c?`<button class="outlined danger" style="margin-top:17px" onclick="deleteCategory('${c.id}')">${ico('trash')} Eliminar categoría</button>`:''}`)

<script id="mj-backup-updates-final">
// Subsistema de datos versionado y actualizaciones Android. No comparte claves con Mi Trastero.
(function(){
'use strict';
const BACKUP_FORMAT='mi-armario-sweet', BACKUP_VERSION=2, MAX_BACKUP_BYTES=30*1024*1024;
const updater=()=>window.MiArmarioUpdates||null;
const bridge=()=>window.MiArmarioAndroid||null;
const safePhoto=s=>typeof s==='string'&&photoOk(s)?s:'';
const fail=(msg)=>{throw new Error(msg)};
function safeText(v,max){return typeof v==='string'?v.slice(0,max):''}
function backupObject(){
  // Se copia TODO el estado local, incluidas las fotos reales de armarios, fotos de categorías,
  // filtros personalizados, probador y prendas. Nunca se comparte por red.
  return {...db,format:BACKUP_FORMAT,version:BACKUP_VERSION,createdAt:new Date().toISOString()};
}
function saveLocalFile(name,mime,content){
  if(bridge()?.beginExport){
    const reader=new FileReader();
    reader.onerror=()=>toast('No se pudo preparar el archivo de copia.');
    reader.onload=()=>{
      try{
        const b64=String(reader.result).split(',')[1]||'';
        if(!b64)fail('La copia está vacía.');
        bridge().beginExport(name,mime);
        for(let i=0;i<b64.length;i+=40000)bridge().appendExport(b64.slice(i,i+40000));
        bridge().finishExport();
      }catch(e){toast(e.message||'No se pudo generar la copia.');}
    };
    reader.readAsDataURL(new Blob([content],{type:mime}));
    return;
  }
  const obj=new Blob([content],{type:mime}),url=URL.createObjectURL(obj),a=document.createElement('a');
  a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),30000);
  toast('Archivo preparado. Comprueba que esté en Descargas.');
}
window.exportBackup=function(){
  try{
    const data=JSON.stringify(backupObject());
    const bytes=new Blob([data],{type:'application/json'}).size;
    if(bytes<100)fail('La copia generada es sospechosamente pequeña.');
    if(bytes>MAX_BACKUP_BYTES)fail('La copia supera los 30 MB. Reduce algunas fotografías antes de exportarla.');
    const d=new Date(),pad=n=>String(n).padStart(2,'0');
    const name=`Maria_Jose_Copia_${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}_${pad(d.getHours())}-${pad(d.getMinutes())}.json`;
    saveLocalFile(name,'application/json',data);
    if(bridge())toast('Selecciona dónde guardar la copia en Android.');
  }catch(e){toast(e.message||'No se pudo preparar la copia.');}
};
window.onNativeExportResult=function(ok,msg){if(ok)toast(msg||'Copia guardada correctamente.');else toast(msg||'La copia no se guardó. Vuelve a intentarlo.')};
function checkBackup(raw){
  if(typeof raw!=='string'||raw.length<20||raw.length>MAX_BACKUP_BYTES)fail('El archivo está vacío o supera el límite de 30 MB.');
  let v;
  try{v=JSON.parse(raw.replace(/^\uFEFF/,''))}catch(_){fail('No es un archivo JSON válido. La copia actual sigue intacta.');}
  if(!v||v.format!==BACKUP_FORMAT||![1,2].includes(Number(v.version)))fail('Este archivo no es una copia compatible de El armario de María José.');
  for(const name of ['items','wardrobes','categories','looks'])if(!Array.isArray(v[name]))fail('Falta una sección necesaria: '+name);
  if(v.items.length>10000||v.wardrobes.length>1000||v.categories.length>1000||v.looks.length>1000||(v.loans?.length||0)>10000)fail('La copia supera el máximo de elementos permitido.');
  const wardrobes=v.wardrobes.map(x=>{if(typeof x!=='string'||!x.trim()||x.length>70)fail('Nombre de armario inválido.');return x});
  if(new Set(wardrobes).size!==wardrobes.length)fail('La copia contiene armarios duplicados.');
  const ids=new Set();
  const cats=v.categories.map(c=>{
    if(!c||typeof c.id!=='string'||!/^[\w-]{1,80}$/.test(c.id)||ids.has(c.id)||typeof c.name!=='string'||c.name.length>55)fail('La copia tiene categorías dañadas o repetidas.');
    ids.add(c.id);
    return {...c,emoji:safeText(c.emoji,8)||'📁',photo:safePhoto(c.photo),iconKey:safeText(c.iconKey,60)||'folder',parentId:typeof c.parentId==='string'&&c.parentId?c.parentId:null};
  });
  const catmap=new Map(cats.map(c=>[c.id,c]));
  for(const c of cats){
    if(c.parentId&&!catmap.has(c.parentId))fail('La copia tiene categorías sin carpeta padre.');
    let parent=c.parentId,seen=new Set([c.id]);
    while(parent){if(seen.has(parent))fail('La copia contiene categorías circulares.');seen.add(parent);parent=catmap.get(parent)?.parentId||null;}
  }
  const itemIds=new Set();
  const items=v.items.map(i=>{
    if(!i||typeof i.id!=='string'||!/^[\w-]{1,80}$/.test(i.id)||itemIds.has(i.id)||!safeText(i.name,100)||!catmap.has(i.category)||!wardrobes.includes(i.wardrobe))fail('La copia tiene prendas duplicadas o con ubicaciones incorrectas.');
    itemIds.add(i.id);
    return {...i,name:safeText(i.name,90),spot:safeText(i.spot,90),size:safeText(i.size,25),color:safeText(i.color,45),notes:safeText(i.notes,800),photo:safePhoto(i.photo),seasons:mjSeasonList(i),occasions:mjEvents(i),favorite:!!i.favorite,donate:!!i.donate};
  });
  const wardrobesPhotos={};
  if(v.wardrobePhotos&&typeof v.wardrobePhotos==='object'&&!Array.isArray(v.wardrobePhotos))for(const w of wardrobes)if(safePhoto(v.wardrobePhotos[w]))wardrobesPhotos[w]=v.wardrobePhotos[w];
  const looks=v.looks.map(l=>{
    if(!l||typeof l.id!=='string'||!/^[\w-]{1,80}$/.test(l.id)||typeof l.name!=='string'||!Array.isArray(l.itemIds))fail('La copia tiene conjuntos incorrectos.');
    return {...l,name:safeText(l.name,80),occasion:safeText(l.occasion,60),itemIds:l.itemIds.filter(id=>itemIds.has(id)).slice(0,100),fittingModelPhoto:safePhoto(l.fittingModelPhoto)};
  });
  const loans=Array.isArray(v.loans)?v.loans.map(l=>{
    if(!l||typeof l.id!=='string'||!/^[\w-]{1,80}$/.test(l.id)||!itemIds.has(l.itemId)||typeof l.person!=='string'||!l.person.trim())fail('La copia tiene préstamos incompletos.');
    return {...l,person:safeText(l.person,100),lentAt:safeText(l.lentAt,10),dueAt:safeText(l.dueAt,10),returnedAt:safeText(l.returnedAt,10),notes:safeText(l.notes,500)};
  }):[];
  return {format:BACKUP_FORMAT,version:BACKUP_VERSION,profile:{name:safeText(v.profile?.name,32)||'María José'},items,wardrobes,wardrobePhotos:wardrobesPhotos,categories:cats,looks,loans,filterSettings:mjSafeChoices(v.filterSettings),lookOccasions:safeLookOccasions(v.lookOccasions),fitting:validateFitting(v.fitting)};
}
function acceptBackup(next){
  // Escribir antes de sustituir el estado en memoria para que la restauración sea atómica.
  const serialized=JSON.stringify(next);
  try{localStorage.setItem(STORAGE_KEY,serialized)}
  catch(_){toast('Falta espacio en el móvil. No se han sustituido tus datos.');return false}
  db=next;ui={tab:'home',search:'',cat:null,wardrobe:null,filter:'all',loanFilter:'active'};
  closeModal();render();toast(`Copia restaurada: ${db.items.length} prendas y ${db.wardrobes.length} armarios. ♡`);return true;
}
window.restoreMariaBackupFromText=function(raw){
  let next;try{next=checkBackup(raw)}catch(e){toast(e.message||'La copia no es válida.');return}
  confirmModal('Restaurar copia completa',`Se recuperarán ${next.items.length} prendas, ${next.wardrobes.length} armarios, ${next.categories.length} categorías y ${next.looks.length} looks, con sus fotografías y ajustes. Esto SUSTITUIRÁ el contenido actual. ¿Continuar?`,'Restaurar',()=>acceptBackup(next));
};
window.chooseImport=function(){
  if(bridge()?.chooseBackup){try{bridge().chooseBackup()}catch(e){toast('No se pudo abrir el selector de Android.')}return;}
  const input=document.createElement('input');input.type='file';input.accept='.json,application/json';
  input.onchange=async()=>{const file=input.files?.[0];if(!file)return;if(!file.size||file.size>MAX_BACKUP_BYTES){toast('La copia está vacía o supera los 30 MB.');return}try{restoreMariaBackupFromText(await file.text())}catch(e){toast('No se pudo abrir el archivo.')}};
  input.click();
};
window.importBackupFromAndroid=async function(){
  const b=bridge();if(!b)return;
  try{
    const err=b.importError();if(err)fail(err);
    const length=b.importLength();if(length<=0||length>MAX_BACKUP_BYTES)fail('La copia está vacía o supera los 30 MB.');
    const chunks=[];
    for(let i=0;i<length;){const chunk=b.importChunk(i,48000);if(!chunk)fail('No se pudo recuperar toda la copia.');chunks.push(chunk);i+=chunk.length;if(chunks.length%20===0)await new Promise(done=>setTimeout(done,0))}
    restoreMariaBackupFromText(chunks.join(''));
  }catch(e){toast(e.message||'No se pudo importar la copia.');}
  finally{try{b.clearImport()}catch(_){}}
};
window.configureAppUpdates=function(){
  const b=updater();if(!b){toast('Disponible al instalar la APK Android preparada para actualizaciones.');return;}
  const feed=b.getFeed()||'';
  activeModal='updates';openModal(`${modalHead('Configurar actualizaciones','Una vez, desde el canal de la familia')}<div class="fieldgroup"><label>Enlace HTTPS del canal de GitHub</label><input id="mj-update-feed-input" type="url" autocomplete="off" spellcheck="false" placeholder="https://raw.githubusercontent.com/usuario/repositorio/main/updates/latest.json" value="${esc(feed)}"></div><p class="smallhelp">Debe terminar en /updates/latest.json. Solo debe contener el código de la app, NUNCA fotografías ni copias del armario.</p><div class="sheet-actions"><button class="outlined" onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveMariaUpdateFeed()">Guardar canal</button></div>`);
};
window.saveMariaUpdateFeed=function(){const b=updater();const url=el('mj-update-feed-input')?.value.trim();if(b?.setFeed(url)){closeModal();toast('Canal guardado ♡')}else toast('Usa una dirección válida de GitHub Raw o GitHub Pages.');};
window.checkAppUpdate=function(){const b=updater();if(!b){toast('En el HTML se usa la versión local. Las mejoras remotas estarán disponibles en la APK.');return;}if(!b.getFeed()){configureAppUpdates();return;}const status=el('mj-updater-status');if(status)status.textContent='Buscando mejoras…';b.check();};
window.onNativeUpdateCheck=function(json){let v;try{v=JSON.parse(json)}catch(_){return}if(v.status==='current'){toast('La aplicación está al día.');return}if(v.status==='error'){toast(v.message||'No se pudo comprobar la actualización.');return}if(v.status==='available'){
  confirmModal('Nueva versión '+safeText(v.version,32),`${safeText(v.notes,250)} Antes de continuar, guarda una copia de seguridad completa en un lugar seguro.`,'Instalar mejora',()=>{updater()?.install();toast('Descargando y verificando la mejora…')});
 }};
window.onNativeUpdateInstalled=function(ok,msg){if(!ok){toast(msg||'No se pudo instalar la mejora.');return}toast('Actualización descargada y comprobada.');setTimeout(()=>updater()?.reloadUi(),400);};
window.mariaUpdaterBridge=updater;
// Evitar falsos «guardado» al agotarse la cuota local de fotografías.
window.persist=function(){
  try{localStorage.setItem(STORAGE_KEY,JSON.stringify(db));return true}
  catch(_){
    try{const previous=localStorage.getItem(STORAGE_KEY);if(previous)db=JSON.parse(previous)}catch(_){}
    setTimeout(()=>{try{render();toast('No se ha guardado: falta espacio en el dispositivo. Se han recuperado los datos anteriores. Exporta una copia JSON.')}catch(_){}},40);
    return false;
  }
};
// Después de que la interfaz completa y los módulos estén preparados se notifica el arranque.
try{const version=el('mj-ui-version');if(version)version.textContent=updater()?.getVersion()||'HTML local';updater()?.uiReady()}catch(_){ }
})();
</script>
